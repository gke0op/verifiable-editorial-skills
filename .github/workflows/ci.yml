name: Verifiable Editorial CI (100% Zero-Python Zig 0.17)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-court-and-demos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Absolute Zero-Python Invariant (0 .py files)
        run: |
          PY_COUNT=$(find . -name "*.py" -not -path "./.git/*" | wc -l | tr -d ' ')
          echo "Python file count: $PY_COUNT"
          test "$PY_COUNT" -eq 0

      - name: Install pure-C mupdf-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mupdf-tools
          mutool -v || true

      - name: Install Zig 0.17.0 (Linux x86_64)
        run: |
          curl -sSL "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          sudo ln -sf /tmp/zig-x86_64-linux-0.17.0/zig /usr/local/bin/zig
          zig version

      - name: Install Rust-native Typst 0.15.1 (Linux musl)
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install veraPDF (ISO 14289-1 / PDF/UA-1 validator)
        run: |
          curl -sSL "https://software.verapdf.org/releases/verapdf-installer.zip" -o /tmp/verapdf.zip
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-src
          INSTALLER=$(find /tmp/verapdf-src -name 'verapdf-izpack-installer-*.jar' | head -n 1)
          java -DINSTALL_PATH="$HOME/verapdf" -jar "$INSTALLER" -options-system
          echo "$HOME/verapdf" >> "$GITHUB_PATH"
          "$HOME/verapdf/verapdf" --version

      - name: Build, Format-Check & Unit-Test Sovereign Zig 0.17.0 Harness (Debug + ReleaseSafe)
        run: |
          cd zig
          zig fmt --check build.zig src/mupdf.zig src/audit.zig src/links.zig src/dissect.zig src/scaffold.zig src/media.zig src/court_tests.zig src/main.zig
          zig build test
          zig build test --release=safe
          zig build --release=safe
          ./zig-out/bin/vedit version
          ./zig-out/bin/vedit fetch-fonts

      - name: Run Full Zero-Python Zig Adversarial Sabotage, Flagship & Closed-Loop Court (Debug + ReleaseSafe)
        run: |
          cd zig
          zig build test-court
          zig build test-court --release=safe

      - name: Build & Certify Typst Carbon Monograph (100% Zero-Python Zig 0.17 + Typst PDF/UA-1) LIVE on Linux
        run: |
          bash demos/typst-carbon-monograph/run_pipeline.sh

      - name: Build & Certify EXOMUNDUS (100% Zero-Python Zig 0.17 + NASA TAP + Typst PDF/UA-1) LIVE on Linux
        run: |
          bash demos/exomundus-nasa-telemetry/run_pipeline.sh

      - name: Build & Certify Elsevier CAIE Two-Column Journal (100% Zero-Python Zig 0.17 PFSP Solver + Typst PDF/UA-1) LIVE on Linux
        run: |
          bash demos/caie-flowshop-journal/run_pipeline.sh

      - name: Build & Certify APS Physical Review Letters (100% Zero-Python Zig 0.17 Yang-Mills Chaos + Typst REVTeX 4.2 PDF/UA-1) LIVE on Linux
        run: |
          bash demos/prl-yang-mills-chaos/run_pipeline.sh

      - name: Build & Certify Cosmos Mobile Field Primer (9:16 WhatsApp PDF/UA-1, 100% Zero-Python Zig 0.17 + 6-Gate Court) LIVE on Linux
        run: |
          bash demos/cosmos-mobile-primer/run_pipeline.sh

      - name: Verify Sovereign Zig CLI Surface (`contrast`, `geometry`, `coverage`, `prose`, `links`, `spreads`, `plate`, `archetypes`)
        run: |
          ./zig/zig-out/bin/vedit archetypes
          ./zig/zig-out/bin/vedit contrast demos/botanica-veridica/report/BOTANICA_VERIDICA_MONOGRAPH.pdf
          ./zig/zig-out/bin/vedit geometry demos/botanica-veridica/report/BOTANICA_VERIDICA_MONOGRAPH.pdf
          ./zig/zig-out/bin/vedit coverage demos/botanica-veridica/report/BOTANICA_VERIDICA_MONOGRAPH.pdf --min-pct 50 --pages "1,4-9"
          ./zig/zig-out/bin/vedit prose demos/botanica-veridica/report/BOTANICA_VERIDICA_MONOGRAPH.pdf \
            --ledger demos/botanica-veridica/data/provenance_ledger.json \
            --summary demos/botanica-veridica/data/summary_metrics.json \
            --citations demos/botanica-veridica/data/background_citations.json \
            --manifest demos/botanica-veridica/data/manifest.sha256
          ./zig/zig-out/bin/vedit links demos/botanica-veridica/report/BOTANICA_VERIDICA_MONOGRAPH.pdf --offline
          ./zig/zig-out/bin/vedit coverage demos/felis-mundi-magazine/report/FELIS_MUNDI_MAGAZINE.pdf --min-pct 50
          ./zig/zig-out/bin/vedit spreads demos/typst-carbon-monograph/report/TYPST_CARBON_MONOGRAPH_UA1.pdf /tmp/ci_spreads --dpi 120 --width 1200
          test -s /tmp/ci_spreads/spread_02_03.png
          ./zig/zig-out/bin/vedit plate demos/cosmos-mobile-primer/report/plates/plate_04_67p.jpg /tmp/ci_plate.jpg --width-pt 304 --height-pt 118 --bg "#07090F"
          test -s /tmp/ci_plate.jpg

      - name: Privacy, installer syntax & host-path hygiene scan
        run: |
          sh -n install.sh
          ! git grep -InE "/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/|C:\\\\Users\\\\" -- README.md install.sh .github/workflows/release.yml skills/ zig/ archetypes/ tests/ demos/
