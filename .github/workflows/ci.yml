name: Verifiable Editorial CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-court-and-demos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test dependencies + pure-C mupdf-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mupdf-tools
          mutool -v || true
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Install Zig 0.17.0 (Linux x86_64)
        run: |
          curl -sSL "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          sudo ln -sf /tmp/zig-x86_64-linux-0.17.0/zig /usr/local/bin/zig
          zig version

      - name: Install Rust-native Typst 0.15.1 (Linux musl)
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install veraPDF (ISO 14289-1 / PDF/UA-1 validator)
        run: |
          curl -sSL "https://software.verapdf.org/releases/verapdf-installer.zip" -o /tmp/verapdf.zip
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-src
          INSTALLER=$(find /tmp/verapdf-src -name 'verapdf-izpack-installer-*.jar' | head -n 1)
          java -DINSTALL_PATH="$HOME/verapdf" -jar "$INSTALLER" -options-system
          echo "$HOME/verapdf" >> "$GITHUB_PATH"
          "$HOME/verapdf/verapdf" --version

      - name: Build & Test Sovereign Zig 0.17.0 Agent Harness (Debug + ReleaseSafe + fmt)
        run: |
          cd zig
          zig fmt --check build.zig src/mupdf.zig src/audit.zig src/links.zig src/dissect.zig src/scaffold.zig src/main.zig
          zig build test
          zig build test --release=safe
          zig build --release=safe
          ./zig-out/bin/vedit version

      - name: Compile Typst PDF/UA-1 Monograph LIVE on Ubuntu Linux + 5-Gate & veraPDF Audit
        run: |
          bash demos/typst-carbon-monograph/run_pipeline.sh

      - name: Build & Certify EXOMUNDUS (100% Zero-Python Zig 0.17 + NASA TAP + Typst PDF/UA-1) LIVE on Linux
        run: |
          bash demos/exomundus-nasa-telemetry/run_pipeline.sh

      - name: Build & Certify Elsevier CAIE Two-Column Journal (100% Zero-Python Zig 0.17 PFSP Solver + Typst PDF/UA-1) LIVE on Linux
        run: |
          bash demos/caie-flowshop-journal/run_pipeline.sh

      - name: Build & Certify APS Physical Review Letters (100% Zero-Python Zig 0.17 Yang-Mills Chaos + Typst REVTeX 4.2 PDF/UA-1) LIVE on Linux
        run: |
          bash demos/prl-yang-mills-chaos/run_pipeline.sh

      - name: Run Sovereign Zig `vedit` 5-Gate Court, Latch, Coverage & Archetype Dissector LIVE on Ubuntu Linux
        run: |
          ./zig/zig-out/bin/vedit latch demos/global-carbon-telemetry
          ./zig/zig-out/bin/vedit audit-all demos/typst-carbon-monograph/report/TYPST_CARBON_MONOGRAPH_UA1.pdf \
            --ledger demos/global-carbon-telemetry/data/provenance_ledger.json \
            --summary demos/global-carbon-telemetry/data/summary_metrics.json \
            --citations demos/typst-carbon-monograph/data/background_citations.json \
            --manifest demos/global-carbon-telemetry/data/manifest.sha256 \
            --require-ua
          ./zig/zig-out/bin/vedit coverage demos/felis-mundi-magazine/report/FELIS_MUNDI_MAGAZINE.pdf --min-pct 50
          ./zig/zig-out/bin/vedit coverage demos/botanica-veridica/report/BOTANICA_VERIDICA_MONOGRAPH.pdf --min-pct 50 --pages "1,4-9"
          ./zig/zig-out/bin/vedit archetypes

      - name: Run Full Adversarial Sabotage, p2zig, Rule 10/11 & Closed-Loop Harness Suite (pytest)
        run: pytest -v

      - name: Run Rule 3/4/6/9 integrity verifiers across live open-data demos
        run: |
          python3 demos/botanica-veridica/scripts/verify_integrity.py
          python3 demos/global-carbon-telemetry/scripts/verify_integrity.py
          python3 demos/carbon-keynote-9slide/scripts/verify_integrity.py

      - name: Run unified `vedit audit-all` CLI on BOTANICA VERIDICA
        run: |
          vedit audit-all demos/botanica-veridica/report/BOTANICA_VERIDICA_MONOGRAPH.pdf \
            --ledger demos/botanica-veridica/data/provenance_ledger.json \
            --summary demos/botanica-veridica/data/summary_metrics.json \
            --citations demos/botanica-veridica/data/background_citations.json \
            --manifest demos/botanica-veridica/data/manifest.sha256 \
            --plate-pages "1,4-9"

      - name: Verify Living Web Edition compiles cleanly under Rule 6 latch
        run: |
          python3 demos/botanica-veridica/report/compile_living_web.py
          test -s demos/botanica-veridica/report/BOTANICA_VERIDICA_LIVING.html

      - name: Privacy & host-path hygiene scan
        run: |
          ! git grep -InE "/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/|C:\\\\Users\\\\" -- README.md skills/ verifiable_editorial/ zig/ archetypes/ tests/ demos/
