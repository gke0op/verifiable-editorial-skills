[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-editorial"
version = "0.2.0"
description = "Automated verification & visual-QA court for verifiable editorial PDFs, magazines, and scientific monographs (WCAG contrast, geometric collision/clipping, Rule 10 prose grounding, clip-aware photo coverage, facing spreads)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.1.0",
]
full = [
    "reportlab>=4.1.0",
    "matplotlib>=3.8.0",
    "weasyprint>=62.0",
]

[project.scripts]
vedit = "verifiable_editorial.cli:main"

[tool.setuptools.packages.find]
include = ["verifiable_editorial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
